name: Checks

# The gate that can be run without a gen1recomp checkout: cart.json's shell
# is still the palette's, label.png is still what the tool draws, and the
# files carried in both this repo and the mod's still match.
#
# The cart's own pins are checked by cart-release.yml, which runs
# `cartkit validate . --online --strict` against the real releases.  The mod
# has its own checks in its own repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python3 -m pip install --quiet pillow

      - name: The cart agrees with itself and the art is current
        run: python3 tools/check.py
