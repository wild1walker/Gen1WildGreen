name: Checks

# The palette copies still agree, the ribbon is still what the tool draws,
# and the mod still does what tests/wild_green_test.lua says it does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Palettes agree and the ribbon is current
        run: python3 tools/check.py

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Mod behaviour
        run: luajit tests/wild_green_test.lua
